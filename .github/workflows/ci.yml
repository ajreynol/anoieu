name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays: has upstream moved under the report?
  workflow_dispatch:

jobs:
  # What the tool says about its own witnesses, and what a run does with those
  # findings: suppression, baselines, configuration, the machine formats.
  suites:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/run.py
      - name: the check catalogue is current
        run: |
          python3 tools/gen_checks_doc.py
          git diff --exit-code docs/checks.md

  # The half that protects the repositories anoieu runs in: every signature we
  # can find is read, and CPC is checked against a baseline committed here, so a
  # change that invents a false positive fails *this* build rather than theirs.
  # The sources are cloned by the run itself, from tools/deps.json — shallow and
  # sparse, and never built, because the analysis reads text.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The counts must be current and every finding must be listed. The report
      # is *additive*: this fails when the checks report something the file does
      # not list, and never when the file lists something they no longer report.
      # Closing a finding is a judgement made by a review step, not by a diff —
      # see "How this file is maintained" in docs/open-findings.md.
      # --pinned restores the commits tools/deps.lock records rather than each
      # branch tip, so this job depends on nothing but this repository: it goes
      # red when a check changes what it reports, never because somebody
      # upstream pushed. Moving to the tips is the refresh job below.
      - name: the report is current for the recorded versions
        run: python3 tools/run.py --pinned --check
      - name: every signature is read without falling over
        run: python3 tools/sweep.py deps/cvc5/proofs/eo deps/ethos/tests
      - name: CPC reports what the baseline says it reports
        run: |
          python3 -m anoieu check \
            deps/cvc5/proofs/eo/cpc/Cpc.eo \
            deps/cvc5/proofs/eo/cpc/expert/CpcExpert.eo \
            --baseline tests/corpus/cpc-baseline.json \
            --deny-warnings
      - name: the CPC triple agrees with itself
        run: |
          python3 -m anoieu check deps/cvc5/proofs/eo/cpc/Cpc.eo \
            --semantics deps/logos/install/defs/Cpc.eos \
            --smt-semantics deps/ethos/tools/eoc/semantics/smt.eos \
            --embedding deps/ethos/plugins/model_smt/model_smt.eo \
            --baseline tests/corpus/triple-baseline.json

  # The differential half: ethos is the authority on what a term desugars to, so
  # the battery is run against a real build of it.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check out ethos
        uses: actions/checkout@v4
        with:
          repository: cvc5/ethos
          ref: ethosEoc3
          path: corpus/ethos
      - name: which ethos this is
        id: ethos
        run: echo "sha=$(git -C corpus/ethos rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # the build is the slow part of this job and depends on nothing but the
      # commit, so it is kept between runs
      - name: cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: corpus/ethos/build
          key: ethos-${{ runner.os }}-${{ steps.ethos.outputs.sha }}
      - name: build ethos
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S corpus/ethos -B corpus/ethos/build -DCMAKE_BUILD_TYPE=Release
          cmake --build corpus/ethos/build -j"$(nproc)"
      - name: the desugarer agrees with the parser
        run: |
          ETHOS=corpus/ethos/build/src/ethos python3 tests/run.py --oracle

      # The promoted reproducers still do what the record beside them says. This
      # is the fuzzer's half of "re-measuring" (docs/reporting-policy.md), and
      # it is a hard failure for the same reason the desugaring battery above is
      # one: a verdict that moves without a reproducer moving is ethos having
      # changed under us, and somebody should look. logos is not built here, so
      # only ethos's half of a disagreement is compared.
      - name: the promoted reproducers still reproduce
        run: |
          ETHOS=corpus/ethos/build/src/ethos python3 -m anoieu_fuzz verify

      # And, since a build of ethos is already here, point the fuzzer at it.
      # On a schedule only, and never failing: a fuzzer that fails a build finds
      # a new bug and turns somebody's unrelated pull request red, which is the
      # one thing docs/philosophy.md is most careful about. What it finds is
      # uploaded and warned about; triage is a human step, as it is for every
      # other finding here. Only the signature mode runs — the differential mode
      # needs a second checker, and building logos is a Lean toolchain away.
      - name: fuzz ethos with signatures nobody would write
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ETHOS=corpus/ethos/build/src/ethos python3 -m anoieu_fuzz run \
            --mode signature -n 4000 --jobs 4 --time-limit 600 \
            --seed-corpus corpus/ethos/tests || true
          buckets=$(find fuzz-findings -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "anoieu-fuzz: $buckets bucket(s)"
          if [ "$buckets" -gt 0 ]; then
            echo "::warning::anoieu-fuzz found $buckets bucket(s); see the artifact, and docs/fuzzing.md for what to do with one"
          fi
      - name: what the fuzzer found
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings/
          if-no-files-found: ignore

  # The other question: what do the checks say about upstream *now*? This moves
  # every clone to its tip and regenerates, so a failure here is news rather
  # than a regression — new findings to triage, or counts to re-record. It is
  # deliberately not on push: nobody's pull request should go red because cvc5
  # merged something.
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: what the checks say about the current tips
        run: |
          python3 tools/run.py
          git --no-pager diff --stat
      - name: the regenerated report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            docs/corpus.md
            docs/open-findings.md
            docs/closed-findings.md
            tools/deps.lock
      - name: say whether upstream moved
        run: |
          if git diff --quiet; then
            echo "the tips report exactly what the recorded versions do"
          else
            echo "::warning::upstream moved; run tools/run.py and commit the result"
            git --no-pager diff -- docs/open-findings.md | head -60
          fi
